name: Verify converter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify converter runner and FFmpeg profile
        run: |
          node --test tests/converter-runner.test.js
          node --check cloudflare/transcoder/src/github-actions-converter-runner.js
          node --check cloudflare/transcoder/src/transcode-utils.js
